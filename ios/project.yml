name: VoiceJournal
options:
  bundleIdPrefix: com.richapatel
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: "YES"
targets:
  VoiceJournal:
    type: application
    platform: iOS
    sources:
      - path: VoiceJournal
    info:
      path: VoiceJournal/Info.plist
      properties:
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSMicrophoneUsageDescription: "Voice Journal records your voice so it can transcribe and save your journal entries."
        NSPhotoLibraryUsageDescription: "Voice Journal needs access to your photos so you can attach them to journal entries."
        NSPhotoLibraryAddUsageDescription: "Voice Journal needs access to save photos you attach to journal entries."
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.richapatel.voicejournal
        PRODUCT_NAME: VoiceJournal
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ""
        TARGETED_DEVICE_FAMILY: "1"
