<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Voice Journal</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <header class="topbar">
    <h1>🎙 Voice Journal</h1>
    <nav class="tabs">
      <button class="tab active" data-tab="record">Home</button>
      <button class="tab" data-tab="entries">Entries</button>
      <button class="tab" data-tab="insights">Insights</button>
    </nav>
  </header>

  <main>
    <!-- ============ HOME / RECORD (the primary screen) ============ -->
    <section id="tab-record" class="tab-panel active">
      <div id="hero" class="hero scene-day">
        <!-- animated sky elements -->
        <div class="sun"></div>
        <div class="moon"></div>
        <div class="cloud c1"></div>
        <div class="cloud c2"></div>
        <div class="stars" id="stars"></div>

        <div class="hero-content">
          <p class="greeting" id="greeting">Hello</p>
          <h2 class="feeling-q">How are you feeling today?</h2>
          <div class="mood-picker" id="moodPicker"></div>
        </div>
      </div>

      <div class="capture-actions">
        <button id="recordBtn" class="capture-btn record"><span class="ico">🎙</span> Record</button>
        <button id="writeBtn" class="capture-btn write"><span class="ico">✍️</span> Type in</button>
      </div>
      <p id="recordHint" class="record-hint">Tap record, or type in your entry</p>
      <p id="liveTranscript" class="live-transcript"></p>

      <div id="composeBox" class="text-compose hidden">
        <textarea id="textInput" placeholder="Type in your entry…"></textarea>
        <div class="compose-actions">
          <label class="attach-btn">
            📎 Attach photo / file
            <input type="file" id="fileInput" multiple hidden />
          </label>
          <button id="saveTextBtn" class="primary">Save entry</button>
        </div>
        <div id="pendingAttachments" class="pending-attachments"></div>
      </div>
    </section>

    <!-- ============ SUGGESTION CARD (appears after save) ============ -->
    <div id="suggestionCard" class="suggestion-card hidden">
      <p class="suggestion-title">Saved! Does this look right?</p>
      <div class="suggestion-row">
        <label>Theme</label>
        <select id="themeSelect"></select>
      </div>
      <div class="suggestion-row">
        <label>Emotion</label>
        <select id="emotionSelect"></select>
      </div>
      <div class="suggestion-actions">
        <button id="confirmBtn" class="primary">Looks right ✓</button>
      </div>
    </div>

    <!-- ============ ENTRIES ============ -->
    <section id="tab-entries" class="tab-panel">
      <div class="filters">
        <label class="field">Theme
          <select id="filterTheme"><option value="">All themes</option></select>
        </label>
        <label class="field">Emotion
          <select id="filterEmotion"><option value="">All emotions</option></select>
        </label>
        <label class="field">Sort by
          <select id="sortBy">
            <option value="date-desc">Date (newest)</option>
            <option value="date-asc">Date (oldest)</option>
            <option value="theme">Theme (A–Z)</option>
            <option value="emotion">Emotion (A–Z)</option>
          </select>
        </label>
      </div>
      <div id="entriesList" class="entries-list"></div>
    </section>

    <!-- ============ INSIGHTS (visualization) ============ -->
    <section id="tab-insights" class="tab-panel">
      <p class="insights-caption">
        Your emotions on the <b>mood map</b>. Bigger circle = more entries.
        Left↔right = unpleasant↔pleasant. Up↔down = high↔low energy.
        <b>Click a circle</b> to see its entries.
      </p>
      <div id="scatter"></div>
      <div id="scatterEntries" class="entries-list"></div>
    </section>
  </main>

  <script src="/app.js"></script>
</body>
</html>
