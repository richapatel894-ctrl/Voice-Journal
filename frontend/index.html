<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MyVoice</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <header class="topbar">
    <h1>🎙 MyVoice</h1>
    <nav class="tabs">
      <button class="tab active" data-tab="record">Home</button>
      <button class="tab" data-tab="entries">Entries</button>
      <button class="tab" data-tab="media">Media</button>
      <button class="tab" data-tab="insights">Insights</button>
    </nav>
  </header>

  <main>
    <!-- ============ HOME ============ -->
    <section id="tab-record" class="tab-panel active">
      <!-- 1) Greeting banner with animated time-of-day sky -->
      <div id="hero" class="hero scene-day">
        <div class="sky">
          <div class="sun"></div>
          <div class="moon"></div>
          <div class="cloud c1"></div>
          <div class="cloud c2"></div>
          <div class="cloud c3"></div>
          <div class="stars" id="stars"></div>
        </div>
        <div class="hero-content">
          <p class="greeting" id="greeting">Hello</p>
          <h2 class="feeling-q">How are you feeling today?</h2>
        </div>
      </div>

      <!-- 2) Record banner (the prominent primary action) -->
      <div class="record-banner">
        <button id="recordBtn" class="record-orb" aria-label="Record"><span class="ico">🎙</span></button>
        <p id="recordHint" class="record-hint">Tap to record</p>
        <p id="liveTranscript" class="live-transcript"></p>
      </div>

      <!-- 3) Type-in box (always visible, secondary) -->
      <div id="composeBox" class="text-compose">
        <textarea id="textInput" placeholder="Or type in your entry…"></textarea>
        <div class="compose-actions">
          <label class="attach-btn">
            📎 Attach photo / file
            <input type="file" id="fileInput" multiple hidden />
          </label>
          <button id="saveTextBtn" class="primary">Save entry</button>
        </div>
        <div id="pendingAttachments" class="pending-attachments"></div>
      </div>

      <!-- Today's entries, right here on Home -->
      <div class="today-feed">
        <h3 class="today-title">Today</h3>
        <div id="todayList" class="entries-list"></div>
      </div>
    </section>

    <!-- transient "Saved ✓" confirmation -->
    <div id="toast" class="toast hidden">✓ Saved</div>

    <!-- ============ ENTRIES ============ -->
    <section id="tab-entries" class="tab-panel">
      <div class="filters">
        <label class="field">Theme
          <select id="filterTheme"><option value="">All themes</option></select>
        </label>
        <label class="field">Emotion
          <select id="filterEmotion"><option value="">All emotions</option></select>
        </label>
        <label class="field">Sort by
          <select id="sortBy">
            <option value="date-desc">Date (newest)</option>
            <option value="date-asc">Date (oldest)</option>
            <option value="theme">Theme (A–Z)</option>
            <option value="emotion">Emotion (A–Z)</option>
          </select>
        </label>
      </div>
      <div id="entriesList" class="entries-list"></div>
    </section>

    <!-- ============ MEDIA (everything: photos, audio, files, links) ============ -->
    <section id="tab-media" class="tab-panel">
      <h2 class="insights-title" style="margin-bottom:14px;">Media library</h2>
      <div id="mediaGroups"></div>
    </section>

    <!-- ============ INSIGHTS ============ -->
    <section id="tab-insights" class="tab-panel">
      <div class="insights-header">
        <h2 class="insights-title">My Emotional Map</h2>
        <select id="rangeFilter">
          <option value="3m">Last 3 months</option>
          <option value="6m">Last 6 months</option>
          <option value="12m">Last 12 months</option>
          <option value="year">This year</option>
          <option value="all">All time</option>
        </select>
      </div>
      <div id="scatter"></div>
      <div id="insightSummary" class="insight-summary"></div>
      <div id="scatterEntries" class="entries-list"></div>
    </section>
  </main>

  <script src="/app.js"></script>
</body>
</html>
